<!DOCTYPE html><html><head><meta charset="utf-8"><title>Kitty Pay Overlay</title><style>
html,body{margin:0;background:transparent;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;color:#ffe4f3}
#c{zoom:var(--z,1);width:340px;height:500px;margin:6px;box-sizing:border-box;background:rgba(24,4,18,.92);border:2px solid #ff4fa8;border-radius:22px;box-shadow:0 0 16px #ff4fa8aa,inset 0 0 12px #ff4fa833;padding:12px 14px 10px;display:flex;flex-direction:column}
#pages{position:relative;flex:1}
.pg{position:absolute;inset:0;opacity:0;transform:translateX(18px);transition:opacity .6s,transform .6s;pointer-events:none}
.pg.on{opacity:1;transform:none}
.h{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.h .k{width:26px;height:26px}.h b{flex:1;font:700 12px monospace;letter-spacing:2px;color:#ffb3dc;text-shadow:0 0 8px #ff4fa8}
.bal{font-size:12px;font-weight:700;color:#ffb3dc}
.sub{font-size:11px;color:#c77aa6;margin:-2px 0 8px}
.big{font:800 34px 'Segoe UI',sans-serif;line-height:1.1;text-shadow:0 0 14px currentColor}
.io{font-size:12px;color:#c77aa6;margin:2px 0 6px}.io span{color:#ffe4f3;font-weight:600}
.chart{position:relative;height:112px;border-radius:10px;background:#1c0615;border:1px solid #ff4fa855;margin-bottom:8px;overflow:hidden}
.chart svg{width:100%;height:100%;display:block}
.lab{position:absolute;font-size:9px;color:#c77aa6}.live{right:8px;bottom:4px;color:#ff78b4;font-weight:700}
.cols{display:flex;gap:10px;margin-bottom:6px}.cols>div{flex:1;min-width:0}
.ct{font:700 10px monospace;letter-spacing:1px;color:#ff78b4;margin-bottom:3px}
.l{display:flex;gap:6px;font-size:12px;line-height:1.55}.l .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.l .v{font-weight:700}
.up{color:#6dffb0}.dn{color:#ff5c8a}
.mini{border-top:1px solid #ff4fa855;padding-top:5px}
.r{display:flex;align-items:center;gap:8px;background:#2a0a20;border:1px solid #ff4fa855;border-radius:9px;padding:5px 9px;margin-bottom:5px;font-size:13px}
.tag{font:700 9px sans-serif;border-radius:5px;padding:3px 6px}
.tag.in{background:#0b3a22;color:#6dffb0;border:1px solid #6dffb0}.tag.out{background:#3a0b1c;color:#ff5c8a;border:1px solid #ff5c8a}
.r .n{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.r .a{font-weight:700}.r .t{color:#c77aa6;font-size:11px;width:30px;text-align:right}
.pn{display:flex;font-size:14px;padding:5px 4px;border-bottom:1px solid #ff4fa822}.pn .n{flex:1;font-weight:600}.pn .v{font-weight:800}
.empty{text-align:center;color:#c77aa6;padding:16px 0;font-size:13px}
.ft{display:flex;align-items:center;gap:6px;height:14px;margin-top:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#5a1a46}.dot.on{background:#ff4fa8;box-shadow:0 0 6px #ff4fa8}
.bar{flex:1;height:3px;border-radius:3px;background:#3a0e2c;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff4fa8,#ffb3dc);animation:fill var(--s,8s) linear forwards}
@keyframes fill{to{width:100%}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="kt" viewBox="0 0 100 100"><g stroke="#46093a" stroke-width="3" stroke-linejoin="round"><polygon points="12,40 14,10 40,26" fill="#ffeef7"/><polygon points="88,40 86,10 60,26" fill="#ffeef7"/><ellipse cx="50" cy="58" rx="41" ry="30" fill="#ffeef7"/><ellipse cx="66" cy="22" rx="10" ry="8" fill="#ff4696"/><ellipse cx="86" cy="22" rx="10" ry="8" fill="#ff4696"/><circle cx="76" cy="22" r="5.5" fill="#ff78b4"/><ellipse cx="50" cy="66" rx="5" ry="3.6" fill="#ff5a96" stroke-width="1.5"/></g><ellipse cx="30" cy="60" rx="3.6" ry="4.6" fill="#46093a"/><ellipse cx="70" cy="60" rx="3.6" ry="4.6" fill="#46093a"/><g stroke="#46093a" stroke-width="2.5" stroke-linecap="round"><path d="M2 60L20 60M2 66L20 64M2 72L20 68M98 60L80 60M98 66L80 64M98 72L80 68"/></g></symbol></defs></svg>
<div id="c"><div id="pages"><div class="pg" id="p0"></div><div class="pg" id="p1"></div><div class="pg" id="p2"></div></div>
<div class="ft"><span class="dot"></span><span class="dot"></span><span class="dot"></span><div class="bar" id="bar"></div></div></div>
<script>
var q=new URLSearchParams(location.search),SEC=+q.get('sec')||8,PIN=+q.get('page')||0;
if(q.get('scale'))document.documentElement.style.setProperty('--z',q.get('scale'));
document.documentElement.style.setProperty('--s',SEC+'s');
function fmt(n){var a=Math.abs(n);if(a>=1e12)return'$'+(a/1e12).toFixed(2)+'T';if(a>=1e9)return'$'+(a/1e9).toFixed(2)+'B';if(a>=1e6)return'$'+(a/1e6).toFixed(2)+'M';if(a>=1e3)return'$'+(a/1e3).toFixed(2)+'K';return'$'+Math.round(a).toLocaleString()}
function sg(n){return(n>=0?'+':'-')+fmt(n)}
function ago(t){var m=Math.floor((Date.now()-t)/60000);if(m<1)return'now';if(m<60)return m+'m';var h=Math.floor(m/60);return h<24?h+'h':Math.floor(h/24)+'d'}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hd(t,bal){return'<div class="h"><svg class="k"><use href="#kt"/></svg><b>'+t+'</b><span class="bal">Bal '+fmt(bal)+'</span></div>'}
function chart(w,net){
 var now=Date.now(),W=300,H=112,P=14,pts=[],c=0;
 var s=w.slice().sort(function(a,b){return a.t-b.t});
 var t0=s.length?s[0].t-60000:now-3600000;pts.push([t0,0]);
 s.forEach(function(x){c+=x.d==='in'?x.a:-x.a;pts.push([x.t,c])});pts.push([now,c]);
 var mx=0,mn=0;pts.forEach(function(p){mx=Math.max(mx,p[1]);mn=Math.min(mn,p[1])});
 if(mx===mn)mx=mn+1;
 var X=function(t){return 4+(t-t0)/Math.max(1,now-t0)*(W-8)},Y=function(v){return P+(mx-v)/(mx-mn)*(H-2*P)};
 var l=pts.map(function(p){return X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)}).join(' ');
 var y0=Y(0).toFixed(1),ly=Math.min(H-14,Math.max(4,Y(c)-9)),col=net>=0?'#6dffb0':'#ff5c8a';
 return'<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4fa8" stop-opacity=".45"/><stop offset="1" stop-color="#ff4fa8" stop-opacity="0"/></linearGradient></defs>'+
 '<line x1="0" x2="'+W+'" y1="'+y0+'" y2="'+y0+'" stroke="#ff78b4" stroke-opacity=".4" stroke-dasharray="3 3"/>'+
 '<polygon points="'+X(t0).toFixed(1)+','+y0+' '+l+' '+X(now).toFixed(1)+','+y0+'" fill="url(#g)"/>'+
 '<polyline points="'+l+'" fill="none" stroke="#ff9ad0" stroke-width="2" stroke-linejoin="round" style="filter:drop-shadow(0 0 3px #ff4fa8)"/></svg>'+
 '<span class="lab" style="left:8px;top:3px">'+fmt(mx)+'</span><span class="lab" style="left:8px;bottom:3px">$0</span><span class="lab live">\u25cf LIVE</span>'+
 '<span style="position:absolute;right:6px;top:'+ly.toFixed(0)+'px;background:'+col+';color:#1a0212;font:800 10px sans-serif;padding:2px 6px;border-radius:6px">'+sg(net)+'</span></div>'}
function lines(a,cls,neg){return a.length?a.map(function(x){return'<div class="l"><span class="n">'+esc(x[0])+'</span><span class="v '+cls+'">'+fmt(x[1])+'</span></div>'}).join(''):'<div class="l"><span class="n" style="color:#c77aa6">\u2014</span></div>'}
function draw(items){
 var cut=Date.now()-864e5,w=items.filter(function(x){return x.t>=cut}),i=0,o=0,pl={};
 w.forEach(function(x){if(x.d==='in'){i+=x.a;pl[x.p]=(pl[x.p]||0)-x.a}else{o+=x.a;pl[x.p]=(pl[x.p]||0)+x.a}});
 var net=i-o,arr=Object.keys(pl).map(function(p){return[p,pl[p]]}).sort(function(a,b){return b[1]-a[1]});
 var win=arr.filter(function(x){return x[1]>0}).slice(0,5),lose=arr.filter(function(x){return x[1]<0}).reverse().slice(0,5).map(function(x){return[x[0],-x[1]]});
 var rec=w.slice().reverse(),mini=rec.slice(0,4).map(function(x){var v=x.d==='in'?x.a:-x.a;return'<div class="l"><span class="n">'+esc(x.p)+'</span><span class="v '+(v>=0?'up':'dn')+'">'+sg(v)+'</span></div>'}).join('')||'<div class="l"><span class="n" style="color:#c77aa6">no payments yet \u2665</span></div>';
 document.getElementById('p0').innerHTML=hd('24H PROFIT',net)+'<div class="big '+(net>=0?'up':'dn')+'">'+sg(net)+'</div><div class="io">In <span>'+fmt(i)+'</span> &nbsp; Out <span>'+fmt(o)+'</span></div>'+chart(w,net)+
  '<div class="cols"><div><div class="ct">TOP WINNERS</div>'+lines(win,'dn')+'</div><div><div class="ct">TOP LOSERS</div>'+lines(lose,'up')+'</div></div><div class="mini">'+mini+'</div>';
 var pn=arr.length>12?arr.slice(0,6).concat(arr.slice(-6)):arr;
 document.getElementById('p1').innerHTML=hd('PLAYER NETS',net)+'<div class="sub">+ means the player is up, \u2212 means they\u2019re down</div>'+
  (pn.length?pn.map(function(x){return'<div class="pn"><span class="n">'+esc(x[0])+'</span><span class="v '+(x[1]>=0?'up':'dn')+'">'+sg(x[1])+'</span></div>'}).join(''):'<div class="empty">waiting for payments \u2665</div>');
 document.getElementById('p2').innerHTML=hd('RECENT PAYMENTS',net)+(rec.length?rec.slice(0,10).map(function(x){return'<div class="r"><span class="tag '+x.d+'">'+(x.d==='in'?'GOT':'SENT')+'</span><span class="n">'+esc(x.p)+'</span><span class="a '+(x.d==='in'?'up':'dn')+'">'+fmt(x.a)+'</span><span class="t">'+ago(x.t)+'</span></div>'}).join(''):'<div class="empty">waiting for payments \u2665</div>')}
var cur=0,pg=document.querySelectorAll('.pg'),dots=document.querySelectorAll('.dot');
function show(n){cur=n;for(var k=0;k<3;k++){pg[k].classList.toggle('on',k===n);dots[k].classList.toggle('on',k===n)}document.getElementById('bar').innerHTML=PIN?'':'<i></i>'}
function poll(){fetch('/api/state').then(function(r){return r.json()}).then(function(j){draw(j.items)}).catch(function(){})}
poll();setInterval(poll,1000);
if(PIN)show((PIN-1)%3);else{show(0);setInterval(function(){show((cur+1)%3)},SEC*1000)}
</script></body></html>
